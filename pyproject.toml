[project]
name = "slopbox"
version = "0.1.0"
description = "A secure-ish environment for running AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8 bugbear
    "SIM",  # flake8 simplify
]
